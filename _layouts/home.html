<!DOCTYPE HTML>
<html lang="en" >
<head>

    {%- include head.html -%}

    {% assign reversed_posts = site.posts | reverse %}

    {% if reversed_posts %}
        <link rel="next" href="{{site.baseurl}}{{reversed_posts.first.url}}" />
    {% endif %}
</head>
<body>
    <div class="book">

        {%- include lc3navigation.html -%}

        <div class="book-body">
            <div class="book-header" role="navigation">
                <!-- Hamburger: toggles .with-summary on .book (same as gitbook sidebar.toggle) -->
                <a class="btn pull-left" aria-label="Toggle sidebar" href="#" onclick="event.preventDefault(); gitbook.sidebar.toggle();">
                    <i class="fa fa-align-justify"></i>
                </a>
                <!-- Title -->
                <h1>
                    {% if page.title %}
                        <a href=".">{{ page.title | escape }}</a>
                    {% else %}
                        <a href=".">{{ site.title | escape }}</a>
                    {% endif %}
                </h1>
                <!-- Theme toggle replaces the sharing button on the right -->
                <div class="theme-switch-container">
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider round"></div>
                    </label>
                </div>
            </div>

            <div class="body-inner">
                {%- include body.html -%}
            </div>
        </div>


        <script>
        var gitbook = gitbook || [];
        gitbook.push(function() {
            gitbook.page.hasChanged({%- include metadata-home.json.tpl -%});
        });
        </script>
    </div>

    {%- include footer.html -%}

</body>
</html>
